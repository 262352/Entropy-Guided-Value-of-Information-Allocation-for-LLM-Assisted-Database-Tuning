[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitune"
version = "0.1.0"
description = "Entropy-guided multi-agent database knob tuning with a GP performance surrogate"
requires-python = ">=3.10,<3.13"
dependencies = [
  "botorch==0.13.0",
  "ConfigSpace==0.7.1",
  "gpytorch==1.14",
  "matplotlib==3.8.2",
  "numpy==1.26.4",
  "PyYAML>=6.0,<7",
  "smac==2.0.2",
  "torch==2.5.1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
cognitune = "cognitune.experiment.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

